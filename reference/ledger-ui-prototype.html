<title>Ledger UI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: a ledger. Narrow index rail on the left, full-bleed specimen grid ruled in ink, titles seated on the baseline of each cell. */
:root{
  --paper:#EDEFEC; --ink:#0D0E11; --mute:#646972; --wash:#DFE3DE; --raise:#F7F8F6;
  --a1:#2433E0; --a2:#A3530A; --a3:#C1122C;
  --ok:#17804A; --warn:#A86400; --bad:#BE2219;
  --on-accent:#FFFFFF;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"Archivo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --f-serif:"Instrument Serif",Georgia,serif;
  --rail:13.5rem; --rule:2px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C0D0F; --ink:#E8EAE5; --mute:#8D929A; --wash:#191B1F; --raise:#131518;
  --a1:#7E88FF; --a2:#FFB020; --a3:#FF5468; --ok:#40C47A; --warn:#E6A43A; --bad:#FF5F52; --on-accent:#0C0D0F; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C0D0F; --ink:#E8EAE5; --mute:#8D929A; --wash:#191B1F; --raise:#131518;
  --a1:#7E88FF; --a2:#FFB020; --a3:#FF5468; --ok:#40C47A; --warn:#E6A43A; --bad:#FF5F52; --on-accent:#0C0D0F; color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{--accent:var(--a1);display:grid;grid-template-columns:var(--rail) minmax(0,1fr);border-left:var(--rule) solid var(--ink);border-right:var(--rule) solid var(--ink);min-height:100%}
.app[data-skin="terminal"]{--accent:var(--a2);--f-display:var(--f-mono);--f-body:var(--f-mono)}
.app[data-skin="folio"]{--accent:var(--a3);--f-display:var(--f-serif)}
.app[data-skin="terminal"]{font-size:14px}

/* RAIL */
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100dvh;overflow:auto;border-right:var(--rule) solid var(--ink);display:flex;flex-direction:column;font-family:var(--f-mono);font-size:12px}
.rail .mark{padding:14px 12px 10px;border-bottom:var(--rule) solid var(--ink);font-family:var(--f-display);font-weight:900;font-stretch:62%;font-size:28px;line-height:.9;letter-spacing:-.01em;text-transform:uppercase}
.app[data-skin="folio"] .rail .mark{font-weight:400;text-transform:none;font-size:30px;font-style:italic}
.rail .grp{padding:14px 12px 4px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;font-size:10.5px}
.rail a{display:flex;gap:10px;padding:5px 12px;color:inherit;text-decoration:none;align-items:baseline}
.rail a span:first-child{color:var(--mute);font-variant-numeric:tabular-nums;width:2.6em;flex:none}
.rail a:hover{background:var(--ink);color:var(--paper)}
.rail a:hover span:first-child{color:var(--paper)}
.rail .foot{margin-top:auto;padding:12px;border-top:var(--rule) solid var(--ink);color:var(--mute);font-size:11px}

/* TOPBAR */
main{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;flex-wrap:wrap;gap:0;border-bottom:var(--rule) solid var(--ink);font-family:var(--f-mono);font-size:12px}
.top .cell{padding:10px 14px;border-right:var(--rule) solid var(--ink);display:flex;align-items:center;gap:10px}
.top .cell:last-child{border-right:0;margin-left:auto}
.top .lbl{color:var(--mute);letter-spacing:.12em;text-transform:uppercase;font-size:10.5px}
.seg{display:inline-flex;border:var(--rule) solid var(--ink)}
.seg button{background:none;border:0;padding:4px 10px;cursor:pointer;font-family:var(--f-mono);font-size:12px}
.seg button+button{border-left:var(--rule) solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* HERO */
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);border-bottom:var(--rule) solid var(--ink)}
.hero h1{margin:0;padding:28px 18px 16px;font-family:var(--f-display);font-weight:900;font-stretch:62%;text-transform:uppercase;font-size:clamp(64px,11vw,168px);line-height:.82;letter-spacing:-.02em;display:flex;align-items:flex-end;min-height:15rem;border-right:var(--rule) solid var(--ink)}
.app[data-skin="folio"] .hero h1{font-weight:400;text-transform:none;font-style:italic;letter-spacing:-.03em}
.app[data-skin="terminal"] .hero h1{font-weight:600;font-size:clamp(48px,7.5vw,112px)}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .meta{display:grid;grid-template-rows:auto 1fr auto auto;min-width:0}
.hero .meta p{margin:0;padding:18px;align-self:end;max-width:44ch;font-size:16px;text-wrap:pretty}
.hero .stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:var(--rule) solid var(--ink)}
.hero .stats div{padding:10px 14px 8px;border-right:var(--rule) solid var(--ink);display:flex;flex-direction:column;justify-content:flex-end;min-height:76px}
.hero .stats div:last-child{border-right:0}
.hero .stats b{font-family:var(--f-display);font-stretch:62%;font-weight:800;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.hero .stats small,.kick{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.install{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:var(--rule) solid var(--ink);font-family:var(--f-mono);font-size:13px;background:var(--ink);color:var(--paper)}
.install code{overflow-x:auto;white-space:nowrap;min-width:0}
.install button{background:var(--accent);color:var(--on-accent);border:0;padding:4px 10px;cursor:pointer;font-family:var(--f-mono);font-size:12px;flex:none}

/* SECTIONS */
.sect-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:30px 18px 10px;border-bottom:var(--rule) solid var(--ink)}
.sect-h h2{margin:0;font-family:var(--f-display);font-weight:900;font-stretch:62%;text-transform:uppercase;font-size:clamp(36px,5vw,64px);line-height:.85}
.app[data-skin="folio"] .sect-h h2{font-weight:400;text-transform:none;font-style:italic}
.sect-h p{margin:0;max-width:40ch;color:var(--mute);font-size:13.5px;text-align:right}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.spec{border-bottom:var(--rule) solid var(--ink);display:flex;flex-direction:column;min-width:0;scroll-margin-top:60px}
.spec{border-right:var(--rule) solid var(--ink)}
.grid{margin-right:calc(-1 * var(--rule))}
.spec.wide{grid-column:1/-1}
.spec-h{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:12px;padding:16px 16px 8px;border-bottom:1px dashed color-mix(in srgb,var(--ink) 35%,transparent)}
.spec-h .no{font-family:var(--f-mono);font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
.spec-h h3{margin:0;font-family:var(--f-display);font-weight:800;font-stretch:75%;font-size:24px;line-height:1;text-transform:uppercase;letter-spacing:-.005em}
.app[data-skin="folio"] .spec-h h3{font-weight:400;text-transform:none;font-size:28px}
.app[data-skin="terminal"] .spec-h h3{font-size:17px;font-weight:600}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1.5px solid var(--ink);padding:2px 6px}
.tag.ai{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.spec .desc{margin:0;padding:8px 16px 0;color:var(--mute);font-size:13.5px;max-width:62ch}
.stage{padding:18px 16px 20px;flex:1;min-width:0}
.spec-f{display:flex;border-top:var(--rule) solid var(--ink);font-family:var(--f-mono);font-size:11.5px}
.spec-f button{background:none;border:0;border-right:var(--rule) solid var(--ink);padding:7px 12px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase}
.spec-f button:hover{background:var(--ink);color:var(--paper)}
.spec-f .file{margin-left:auto;padding:7px 12px;color:var(--mute)}
pre.usage{margin:0;padding:14px 16px;background:var(--ink);color:var(--paper);font-family:var(--f-mono);font-size:12.5px;line-height:1.55;overflow-x:auto}

/* PRIMITIVES */
.btn{--sh:var(--ink);position:relative;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:var(--rule) solid var(--ink);background:var(--paper);cursor:pointer;font-family:var(--f-mono);font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;box-shadow:4px 4px 0 var(--sh);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--sh)}
.btn.ink{background:var(--ink);color:var(--paper)}
.btn.acc{background:var(--accent);color:var(--on-accent);border-color:var(--ink)}
.btn.ghost{box-shadow:none;border-style:dashed}
.btn.ghost:active{transform:none;background:var(--wash)}
.btn .fill{position:absolute;inset:0;background:var(--bad);transform-origin:left;transform:scaleX(var(--p,0))}
.btn .lab{position:relative}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.col{display:flex;flex-direction:column;gap:14px}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between}
.field input,.field textarea{background:transparent;border:0;border-bottom:var(--rule) solid var(--ink);padding:6px 0 4px;font-size:20px;font-family:var(--f-display);font-stretch:80%;outline:none;border-radius:0;width:100%}
.field input:focus{border-bottom-color:var(--accent)}
.field .err{color:var(--bad);font-family:var(--f-mono);font-size:11.5px}

.tabs{position:relative;display:flex;border-bottom:var(--rule) solid var(--ink);overflow-x:auto}
.tabs button{background:none;border:0;padding:8px 14px 6px;cursor:pointer;font-family:var(--f-display);font-stretch:75%;font-weight:700;font-size:18px;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs .bar{position:absolute;bottom:-2px;height:5px;background:var(--accent);transition:left .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1)}
.tabpanel{padding:14px 0 0;font-size:14px;color:var(--mute);max-width:52ch;min-height:4.5em}

.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-family:var(--f-mono);font-size:12px;background:none;border:0;padding:0}
.switch .trk{width:46px;height:24px;border:var(--rule) solid var(--ink);position:relative;background:var(--paper)}
.switch .knb{position:absolute;top:2px;left:2px;width:16px;height:16px;background:var(--ink);transition:left .2s}
.switch[aria-checked="true"] .trk{background:var(--accent)}
.switch[aria-checked="true"] .knb{left:24px;background:var(--paper)}

/* TABLE */
.tscroll{overflow-x:auto;margin:-18px -16px -20px}
table.ledger{border-collapse:collapse;width:100%;min-width:620px;font-variant-numeric:tabular-nums}
table.ledger td,table.ledger th{padding:22px 12px 6px;vertical-align:bottom;text-align:left;border-left:1px solid color-mix(in srgb,var(--ink) 18%,transparent)}
table.ledger .rn{width:2.6rem;border-left:0;border-right:var(--rule) solid var(--ink);font-family:var(--f-mono);font-size:11px;color:var(--mute);text-align:right;padding-right:8px}
table.ledger .title td{padding:26px 12px 10px;font-family:var(--f-display);font-weight:900;font-stretch:62%;text-transform:uppercase;font-size:42px;line-height:.9;border-left:0}
.app[data-skin="folio"] table.ledger .title td{font-weight:400;text-transform:none;font-style:italic}
table.ledger .title td.rn{font-size:11px;font-weight:400;font-family:var(--f-mono);font-style:normal;line-height:1.5}
table.ledger th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:500;padding-top:10px;border-bottom:var(--rule) solid var(--ink)}
table.ledger th button{all:unset;cursor:pointer;display:inline-flex;gap:6px}
table.ledger th button:focus-visible{outline:2px solid var(--accent)}
table.ledger th[aria-sort] {color:var(--ink)}
table.ledger .num{text-align:right}
table.ledger tbody tr{transition:background .12s}
table.ledger tbody tr:hover{background:var(--ink);color:var(--paper)}
table.ledger tbody tr:hover td{color:var(--paper)}
table.ledger td.big{font-family:var(--f-display);font-stretch:75%;font-weight:700;font-size:20px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.pill::before{content:"";width:8px;height:8px;background:currentColor}
.pill.pass{color:var(--ok)}.pill.drift{color:var(--warn)}.pill.fail{color:var(--bad)}
tr:hover .pill{color:inherit}
.bar-in{display:inline-block;height:6px;background:var(--accent);vertical-align:middle;margin-right:8px}

/* MOTION */
.roll{display:inline-flex;font-family:var(--f-display);font-weight:900;font-stretch:62%;font-size:clamp(56px,8vw,92px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app[data-skin="folio"] .roll{font-weight:400}
.rc{display:inline-block;height:1em;overflow:hidden}
.rs{display:flex;flex-direction:column;transition:transform .9s cubic-bezier(.2,.9,.15,1)}
.rs span{height:1em;display:block}
.scr{font-family:var(--f-display);font-weight:900;font-stretch:62%;font-size:clamp(34px,5vw,54px);line-height:.95;text-transform:uppercase;word-break:break-word}
.app[data-skin="folio"] .scr{font-weight:400}
.marq{overflow:hidden;border-top:var(--rule) solid var(--ink);border-bottom:var(--rule) solid var(--ink);margin:0 -16px;white-space:nowrap}
.marq .tr{display:inline-flex;animation:mq 22s linear infinite}
.marq:hover .tr{animation-play-state:paused}
.marq span{font-family:var(--f-display);font-weight:800;font-stretch:62%;text-transform:uppercase;font-size:34px;padding:8px 18px;line-height:1}
.marq span:nth-child(even){color:var(--accent)}
@keyframes mq{to{transform:translateX(-50%)}}
.stg{list-style:none;margin:0;padding:0}
.stg li{display:grid;grid-template-columns:2.4rem 1fr auto;gap:10px;align-items:end;padding:12px 0 4px;border-bottom:1px solid color-mix(in srgb,var(--ink) 18%,transparent);animation:sin .55s cubic-bezier(.2,.8,.2,1) both}
.stg li b{font-family:var(--f-display);font-stretch:75%;font-size:19px;text-transform:uppercase}
.stg li span{font-family:var(--f-mono);font-size:11px;color:var(--mute)}
@keyframes sin{from{opacity:.0;transform:translateX(-18px)}to{opacity:1;transform:none}}

/* AI */
.stream{font-size:16px;line-height:1.6;max-width:62ch;min-height:8.5em;text-wrap:pretty}
.cite{display:inline-flex;align-items:center;justify-content:center;min-width:1.4em;height:1.25em;padding:0 4px;margin:0 2px;font-family:var(--f-mono);font-size:10.5px;background:var(--ink);color:var(--paper);vertical-align:2px;cursor:help}
.cite:hover{background:var(--accent);color:var(--on-accent)}
.caret{display:inline-block;width:.55em;height:1.05em;background:var(--accent);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.srcs{display:flex;flex-wrap:wrap;gap:0;margin-top:14px;border:var(--rule) solid var(--ink)}
.srcs div{flex:1 1 140px;padding:6px 10px;border-right:var(--rule) solid var(--ink);font-size:12px;min-width:0}
.srcs div:last-child{border-right:0}
.srcs b{font-family:var(--f-mono);font-size:10.5px;color:var(--mute);display:block}

.trace{font-family:var(--f-mono);font-size:12.5px}
.trace .st{display:grid;grid-template-columns:1.6rem 5.2rem minmax(0,1fr) 4.4rem;gap:10px;align-items:end;padding:10px 0 5px;border-bottom:1px solid color-mix(in srgb,var(--ink) 18%,transparent);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.trace .st:hover{background:var(--wash)}
.trace .ic{width:12px;height:12px;border:var(--rule) solid var(--ink);align-self:center}
.trace .done .ic{background:var(--ink)}
.trace .run .ic{background:var(--accent);border-color:var(--accent);animation:pulse .8s ease-in-out infinite alternate}
.trace .queued{color:var(--mute)}
.trace .tool{font-weight:600;text-transform:uppercase}
.trace .arg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trace .ms{text-align:right;font-variant-numeric:tabular-nums;color:var(--mute)}
.trace .out{padding:6px 0 10px 2.6rem;color:var(--mute)}
.trace .tl{height:6px;background:var(--wash);margin:12px 0 0;position:relative}
.trace .tl i{position:absolute;top:0;bottom:0;background:var(--accent);transition:width .3s}
@keyframes pulse{to{opacity:.35}}

.composer{border:var(--rule) solid var(--ink);background:var(--raise)}
.composer textarea{width:100%;border:0;background:transparent;resize:none;padding:12px 14px;font-size:16px;font-family:var(--f-body);min-height:84px;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);padding:2px 4px 2px 8px;font-family:var(--f-mono);font-size:11.5px;background:var(--paper)}
.chip button{background:none;border:0;cursor:pointer;padding:0 4px;font-size:13px;line-height:1}
.cbar{display:flex;flex-wrap:wrap;align-items:stretch;border-top:var(--rule) solid var(--ink);font-family:var(--f-mono);font-size:12px}
.cbar > *{border-right:var(--rule) solid var(--ink)}
.cbar select{background:var(--paper);border:0;padding:8px 10px;font-family:var(--f-mono);font-size:12px;border-radius:0;cursor:pointer}
.cbar .meter{flex:1;display:flex;align-items:center;gap:10px;padding:0 12px;min-width:140px}
.cbar .meter div{flex:1;height:6px;background:var(--wash)}
.cbar .meter i{display:block;height:100%;background:var(--ink)}
.cbar .send{border-right:0;background:var(--accent);color:var(--on-accent);border:0;padding:8px 16px;cursor:pointer;font-family:var(--f-mono);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.cbar .send:disabled{background:var(--wash);color:var(--mute);cursor:not-allowed}
.toast{margin-top:10px;font-family:var(--f-mono);font-size:12px;color:var(--ok)}

.think{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.wave{display:flex;align-items:flex-end;gap:3px;height:56px}
.wave i{width:6px;background:var(--ink);height:20%;animation:wv 1.1s ease-in-out infinite}
.wave i:nth-child(3n){background:var(--accent)}
@keyframes wv{0%,100%{height:14%}50%{height:100%}}
.think .msg{font-family:var(--f-display);font-weight:800;font-stretch:62%;font-size:30px;text-transform:uppercase;line-height:1}
.app[data-skin="folio"] .think .msg{font-weight:400;text-transform:none;font-style:italic}

.ctx .bar{display:flex;height:34px;border:var(--rule) solid var(--ink)}
.ctx .bar div{height:100%;border-right:var(--rule) solid var(--ink);transition:width .5s}
.ctx .legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-top:10px;gap:8px 14px}
.ctx .legend div{display:flex;flex-direction:column;gap:2px;font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.ctx .legend b{font-family:var(--f-display);font-stretch:75%;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.ctx .legend i{display:inline-block;width:10px;height:10px;margin-right:6px;border:1.5px solid var(--ink);vertical-align:-1px}

.mx{overflow-x:auto}
.mx table{border-collapse:collapse;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;width:100%;min-width:420px}
.mx th{text-align:left;font-weight:500;color:var(--mute);padding:6px 8px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.mx td{padding:0;border:1.5px solid var(--paper)}
.mx td div{padding:14px 8px 4px;text-align:right}
.mx td.mn{font-weight:600;padding:4px 8px;border:0;white-space:nowrap}

/* SCREENS */
.frame{border:var(--rule) solid var(--ink);background:var(--raise);position:relative;overflow:hidden}
.frame .chrome{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:var(--rule) solid var(--ink);font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.frame .chrome i{display:inline-block;width:9px;height:9px;border:1.5px solid var(--ink);margin-right:4px}
.cmdk-stage{height:360px;display:grid;place-items:center;padding:16px}
.cmdk-hint{text-align:center;font-family:var(--f-mono);font-size:12px;color:var(--mute)}
.kbd{display:inline-block;border:1.5px solid var(--ink);border-bottom-width:3px;padding:1px 6px;font-family:var(--f-mono);font-size:11px;color:var(--ink);background:var(--paper)}
.scrim{position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 30%,transparent);display:flex;justify-content:center;align-items:flex-start;padding:34px 14px}
.cmdk{width:min(520px,100%);background:var(--paper);border:var(--rule) solid var(--ink);box-shadow:8px 8px 0 var(--ink);animation:pop .18s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:translateY(-8px);opacity:.4}}
.cmdk input{width:100%;border:0;border-bottom:var(--rule) solid var(--ink);padding:12px 14px;font-size:18px;font-family:var(--f-display);font-stretch:80%;background:transparent;outline:none}
.cmdk ul{list-style:none;margin:0;padding:4px 0;max-height:220px;overflow:auto}
.cmdk li.g{padding:8px 14px 2px;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.cmdk li.it{display:flex;justify-content:space-between;padding:7px 14px;cursor:pointer;font-size:14px}
.cmdk li.it[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.cmdk li.it[aria-selected="true"] .kbd{background:var(--ink);color:var(--paper);border-color:var(--paper)}
.cmdk .empty{padding:14px;color:var(--mute);font-family:var(--f-mono);font-size:12px}

.chat{display:grid;grid-template-columns:200px minmax(0,1fr);height:440px}
.chat aside{border-right:var(--rule) solid var(--ink);display:flex;flex-direction:column;font-size:13px;min-width:0}
.chat aside .new{margin:10px;border:var(--rule) solid var(--ink);background:var(--ink);color:var(--paper);padding:6px;font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
.chat aside button.th{all:unset;cursor:pointer;padding:8px 12px 4px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat aside button.th small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--mute)}
.chat aside button.th[aria-current="true"]{background:var(--accent);color:var(--on-accent)}
.chat aside button.th[aria-current="true"] small{color:inherit;opacity:.8}
.chat aside button.th:focus-visible{outline:2px solid var(--accent)}
.chat .pane{display:flex;flex-direction:column;min-width:0}
.chat .log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.msgu{align-self:flex-end;max-width:78%;background:var(--ink);color:var(--paper);padding:8px 12px;font-size:14px}
.msga{max-width:88%;font-size:14px}
.msga .who{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.chat .mini{display:flex;border-top:var(--rule) solid var(--ink)}
.chat .mini input{flex:1;border:0;background:transparent;padding:10px 12px;outline:none;min-width:0}
.chat .mini button{border:0;border-left:var(--rule) solid var(--ink);background:var(--accent);color:var(--on-accent);padding:0 14px;font-family:var(--f-mono);font-size:12px;cursor:pointer;text-transform:uppercase}

.dash .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:var(--rule) solid var(--ink)}
.dash .kpi{padding:12px 12px 8px;border-right:var(--rule) solid var(--ink);display:flex;flex-direction:column;gap:2px;min-width:0}
.dash .kpi:last-child{border-right:0}
.dash .kpi b{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-size:40px;line-height:.95;font-variant-numeric:tabular-nums}
.app[data-skin="folio"] .dash .kpi b{font-weight:400}
.dash .kpi svg{width:100%;height:34px;display:block;margin-top:6px}
.delta{font-family:var(--f-mono);font-size:11px}
.delta.up{color:var(--ok)}.delta.dn{color:var(--bad)}
.dash .split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.dash .chart{padding:12px;border-right:var(--rule) solid var(--ink);min-width:0}
.dash .chart svg{width:100%;height:170px;display:block}
.dash .feed{padding:12px;font-family:var(--f-mono);font-size:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dash .feed div{display:grid;grid-template-columns:3.6rem 1fr;gap:8px}
.dash .feed span{color:var(--mute)}

.colophon{padding:22px 18px 40px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;font-size:13.5px}
.colophon h4{margin:0 0 6px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:500}
.colophon p{margin:0;max-width:40ch}

/* ── v2: engines ── */
.terrain{height:250px;border-bottom:var(--rule) solid var(--ink);position:relative;cursor:crosshair;touch-action:pan-y;min-width:0;overflow:hidden}
.spec .terrain{height:360px;border:var(--rule) solid var(--ink)}
.terrain canvas,.gl canvas{display:block;width:100%;height:100%}
.cap{position:absolute;left:10px;bottom:8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);pointer-events:none}
.dval{font-family:var(--f-display);font-weight:900;font-stretch:62%;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums}
.app[data-skin="folio"] .dval{font-weight:400}

.mag-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px dashed color-mix(in srgb,var(--ink) 40%,transparent)}
.mag-zone{display:grid;place-items:center;padding:44px 12px;min-width:0}
.mag-zone+.mag-zone{border-left:1px dashed color-mix(in srgb,var(--ink) 40%,transparent)}
.btn.mag{font-size:14px;padding:16px 22px;will-change:transform}

.dslider{position:relative;height:56px;margin:8px 12px 0;cursor:pointer;touch-action:none}
.dslider::before{content:"";position:absolute;left:0;right:0;top:27px;height:2px;background:var(--ink)}
.dfill{position:absolute;left:0;top:24px;height:8px;background:var(--accent);width:0}
.dslider i{position:absolute;top:14px;width:2px;height:28px;margin-left:-1px;background:color-mix(in srgb,var(--ink) 30%,transparent)}
.dslider i.on{background:var(--ink)}
.dthumb{position:absolute;left:0;top:10px;width:0;height:36px}
.dthumb span{position:absolute;left:-14px;top:4px;width:28px;height:28px;background:var(--ink);border:var(--rule) solid var(--paper);box-shadow:0 0 0 var(--rule) var(--ink)}
.dslider:focus-visible{outline:none}
.dslider:focus-visible .dthumb span{background:var(--accent)}
.dlabels{display:flex;justify-content:space-between;margin:0 4px;font-family:var(--f-mono);font-size:10.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.zone{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:var(--rule) solid var(--ink);padding:3px 8px}

.ticket{position:relative;border:var(--rule) solid var(--ink);background:var(--raise);padding:14px 16px 16px;font-family:var(--f-mono);font-size:13px;max-width:640px;overflow:hidden}
.t-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:1px dashed color-mix(in srgb,var(--ink) 40%,transparent);padding-bottom:8px;margin-bottom:10px}
.t-call{font-family:var(--f-display);font-weight:800;font-stretch:75%;font-size:26px;line-height:1}
.app[data-skin="folio"] .t-call{font-weight:400}
.t-call span{color:var(--mute)}
.t-args{border-collapse:collapse;margin:8px 0 8px 18px}
.t-args td{padding:3px 14px 3px 0;vertical-align:bottom}
.t-args td:first-child{color:var(--mute)}
.stamp{position:absolute;right:18px;top:38%;padding:6px 14px;border:4px double currentColor;font-family:var(--f-display);font-weight:900;font-stretch:62%;font-size:44px;letter-spacing:.06em;text-transform:uppercase;line-height:1;pointer-events:none;mix-blend-mode:multiply;transform:rotate(-8deg);
  -webkit-mask-image:repeating-linear-gradient(115deg,#000 0 3px,rgba(0,0,0,.72) 3px 5px);mask-image:repeating-linear-gradient(115deg,#000 0 3px,rgba(0,0,0,.72) 3px 5px)}
.stamp.approved{color:var(--accent)}.stamp.denied{color:var(--bad)}
:root[data-theme="dark"] .stamp{mix-blend-mode:normal}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stamp{mix-blend-mode:normal}}

.flap{background:var(--ink);color:var(--paper);padding:12px;overflow-x:auto}
.flap-h{display:flex;gap:0;color:color-mix(in srgb,var(--paper) 60%,transparent);margin-bottom:8px;min-width:max-content}
.flap-h span{width:calc(8 * (1.3em + 3px))}
.flap-h span:last-child{width:auto}
.flap-r{display:flex;gap:3px;margin-bottom:3px;min-width:max-content;perspective:300px}
.flap-r span{width:1.3em;height:1.75em;display:grid;place-items:center;background:color-mix(in srgb,var(--paper) 10%,var(--ink));font-family:var(--f-mono);font-weight:600;font-size:clamp(13px,1.8vw,19px);position:relative;transform-origin:50% 50%;backface-visibility:hidden}
.flap-r span::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--ink)}
.flap-r span:nth-last-child(-n+3){color:var(--accent)}

.heat-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;overflow-x:auto}
.heat-days{display:grid;grid-template-rows:repeat(7,1fr);gap:3px}
.heat-days span{display:flex;align-items:center;font-size:10px}
.heat{display:grid;grid-template-columns:repeat(24,minmax(12px,1fr));gap:3px;min-width:360px}
.hc{aspect-ratio:1;border:0;padding:0;cursor:pointer;max-width:100%}
.hc.sel{outline:2px solid var(--ink);outline-offset:1px}
.hc:focus-visible{outline:2px solid var(--ink)}

.drawsvg{width:100%;height:auto;display:block}

.swipe{position:relative;height:300px;display:grid;place-items:center;isolation:isolate}
.rcard{position:absolute;inset:14px 12% 26px;background:var(--raise);border:var(--rule) solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:14px 16px;user-select:none;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.rq{font-family:var(--f-display);font-weight:800;font-stretch:75%;font-size:24px;line-height:1.05;text-wrap:balance}
.app[data-skin="folio"] .rq{font-weight:400}
.ra{margin:2px 0 8px;font-size:14px;max-width:52ch}
.verdict{position:absolute;top:12px;padding:3px 8px;border:3px solid currentColor;font-family:var(--f-mono);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;pointer-events:none}
.verdict.ok{right:12px;color:var(--ok);transform:rotate(6deg)}
.verdict.no{left:12px;color:var(--bad);transform:rotate(-6deg)}
.swipe-empty{display:flex;flex-direction:column;align-items:center;gap:10px}
.swipe-empty b{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-size:40px;text-transform:uppercase}
.btn:disabled{opacity:.45;cursor:not-allowed}

.embed{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);border:var(--rule) solid var(--ink)}
.gl{position:relative;height:380px;cursor:grab;touch-action:none;border-right:var(--rule) solid var(--ink);min-width:0;overflow:hidden}
.embed-side{padding:12px 14px;min-width:0;display:flex;flex-direction:column}
.qlist{display:flex;flex-direction:column;margin-top:6px;border:var(--rule) solid var(--ink)}
.qlist button{background:none;border:0;text-align:left;padding:8px 10px;cursor:pointer;font-size:14px}
.qlist button+button{border-top:1px solid color-mix(in srgb,var(--ink) 25%,transparent)}
.qlist button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.hits{list-style:none;margin:6px 0 0;padding:0;font-family:var(--f-mono);font-size:12px;counter-reset:h}
.hits li{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto;gap:6px;padding:6px 0 2px;border-bottom:1px solid color-mix(in srgb,var(--ink) 15%,transparent);counter-increment:h;align-items:end}
.hits li::before{content:counter(h,decimal-leading-zero);color:var(--mute)}
.hits li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hits li span:last-child{color:var(--accent);font-variant-numeric:tabular-nums}
@media (max-width:760px){
  .embed{grid-template-columns:minmax(0,1fr)}
  .gl{border-right:0;border-bottom:var(--rule) solid var(--ink);height:300px}
  .mag-row{grid-template-columns:minmax(0,1fr)}
  .mag-zone+.mag-zone{border-left:0;border-top:1px dashed color-mix(in srgb,var(--ink) 40%,transparent)}
  .rcard{inset:14px 4% 26px}
  .stamp{font-size:32px;right:10px}
}

/* ── v3: depth ── */
.kv{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:8px 0 3px;border-bottom:1px solid color-mix(in srgb,var(--ink) 18%,transparent);font-size:13.5px;min-width:0}
.kv>span:first-child{color:var(--mute);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.kv b{font-family:var(--f-display);font-stretch:75%;font-size:20px;font-variant-numeric:tabular-nums}
.kv .roll{font-size:30px}
.kv.big .roll{font-size:46px}
.kv.big>span:last-child{font-family:var(--f-mono);font-size:12px;display:flex;align-items:flex-end;gap:6px}

.tilt-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.tilt-stage{perspective:900px;padding:22px 8px 10px;width:100%;display:grid;place-items:center;touch-action:pan-y}
.tilt{position:relative;width:min(300px,100%);padding:20px 20px 22px;background:var(--raise);border:var(--rule) solid var(--ink);box-shadow:8px 8px 0 var(--ink);transform-style:preserve-3d;display:flex;flex-direction:column;gap:14px;will-change:transform}
.tilt .z{transform-style:preserve-3d}
.tilt-name{font-family:var(--f-display);font-weight:900;font-stretch:62%;font-size:46px;line-height:.9;text-transform:uppercase}
.app[data-skin="folio"] .tilt-name{font-weight:400;text-transform:none;font-style:italic}
.tilt .roll{font-size:62px;margin-bottom:6px}
.tilt-list{list-style:none;margin:0;padding:0;font-size:14px}
.tilt-list li{padding:6px 0 2px;border-bottom:1px solid color-mix(in srgb,var(--ink) 18%,transparent)}
.tilt-list li::before{content:"+ ";color:var(--accent);font-family:var(--f-mono)}
.tilt-badge{position:absolute;top:-14px;right:-14px;background:var(--accent);color:var(--on-accent);font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border:var(--rule) solid var(--ink)}
.glare{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),color-mix(in srgb,#fff 42%,transparent),transparent 58%)}

.orb{display:grid;grid-template-columns:minmax(0,1fr);gap:0;border:var(--rule) solid var(--ink)}
.orb-gl{height:250px;border-bottom:var(--rule) solid var(--ink);cursor:default;touch-action:pan-y}
.orb-side{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.orb-text{margin:0;min-height:3.2em;font-family:var(--f-display);font-stretch:80%;font-size:21px;line-height:1.2;text-wrap:pretty}

.cfg{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);border:var(--rule) solid var(--ink)}
.cfg-gl{height:430px;border-right:var(--rule) solid var(--ink)}
.cfg-side{padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.cfg-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.field input.rng{-webkit-appearance:none;appearance:none;width:100%;height:26px;padding:0;border:0;background:transparent;cursor:pointer;font-size:inherit}
input.rng::-webkit-slider-runnable-track{height:2px;background:var(--ink)}
input.rng::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;margin-top:-9px;background:var(--accent);border:var(--rule) solid var(--ink);border-radius:0}
input.rng::-moz-range-track{height:2px;background:var(--ink)}
input.rng::-moz-range-thumb{width:16px;height:16px;border-radius:0;background:var(--accent);border:var(--rule) solid var(--ink)}
input.rng:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bom{border-top:var(--rule) solid var(--ink);margin-top:auto}

.cf{position:relative;height:320px;perspective:1100px;overflow:hidden;cursor:grab;touch-action:pan-y;border:1px dashed color-mix(in srgb,var(--ink) 40%,transparent)}
.cf:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cf-card{position:absolute;left:50%;top:50%;width:min(220px,50%);height:262px;background:var(--raise);border:var(--rule) solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:14px;display:flex;flex-direction:column;gap:4px;user-select:none;will-change:transform}
.cf-card.on::before{content:"";position:absolute;inset:0 0 auto;height:7px;background:var(--accent)}
.cf-name{font-family:var(--f-display);font-weight:900;font-stretch:62%;font-size:32px;line-height:.92;text-transform:uppercase;word-break:break-word;margin-top:6px}
.app[data-skin="folio"] .cf-name{font-weight:400;text-transform:none;font-style:italic}
.cf-num{font-family:var(--f-display);font-weight:800;font-stretch:75%;font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.cf-bar{height:6px;background:var(--wash);margin-top:8px}.cf-bar i{display:block;height:100%;background:var(--accent)}

.cube-box{position:relative;height:250px;perspective:1300px}
.cube{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--raise);border:var(--rule) solid var(--ink);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.face-v{font-family:var(--f-display);font-weight:900;font-stretch:62%;font-size:64px;line-height:.9;font-variant-numeric:tabular-nums;margin-top:4px}
.app[data-skin="folio"] .face-v{font-weight:400}
.fbars{display:flex;align-items:flex-end;gap:6px;height:60px;margin-top:auto}
.fbars i{flex:1}
.face-n{font-size:12.5px;color:var(--mute);padding-top:6px}

.fold-h{padding:0 0 10px;border-bottom:var(--rule) solid var(--ink)}
.fold-t{font-family:var(--f-display);font-weight:900;font-stretch:62%;font-size:34px;line-height:.95;text-transform:uppercase}
.app[data-skin="folio"] .fold-t{font-weight:400;text-transform:none;font-style:italic}
.fhead{all:unset;box-sizing:border-box;display:grid;grid-template-columns:2rem minmax(0,1fr) auto 1.4rem;gap:10px;align-items:end;width:100%;padding:12px 0 6px;border-bottom:1px solid color-mix(in srgb,var(--ink) 30%,transparent);cursor:pointer}
.fhead:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fhead b{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:21px;text-transform:uppercase;line-height:1}
.app[data-skin="folio"] .fhead b{font-weight:400;text-transform:none}
.fhead i{font-style:normal;font-family:var(--f-mono);font-size:20px;line-height:1;transition:transform .3s;text-align:center}
.fitem.open .fhead i{transform:rotate(45deg);color:var(--accent)}
.fitem.open .fhead{border-bottom-color:var(--ink)}
.fbody{overflow:hidden}
.finner{perspective:700px;padding:2px 0 10px}
.frow{display:grid;grid-template-columns:4.6rem minmax(0,1fr);gap:10px;padding:8px 0 3px;border-bottom:1px dashed color-mix(in srgb,var(--ink) 25%,transparent);transform-origin:50% 0;background:var(--paper);font-size:14px}
.frow span:first-child{font-family:var(--f-mono);font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}

.drum-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:center}
.drum{position:relative;height:260px;perspective:900px;overflow:hidden;cursor:grab;touch-action:none;border:var(--rule) solid var(--ink);background:var(--raise);
  -webkit-mask-image:linear-gradient(transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(transparent,#000 24%,#000 76%,transparent)}
.drum:focus-visible{outline:none}
.drum:focus-visible .drum-band{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.drum-wheel{position:absolute;left:0;right:0;top:50%;height:42px;margin-top:-21px;transform-style:preserve-3d}
.drum-it{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:25px;text-transform:uppercase;backface-visibility:hidden;user-select:none}
.app[data-skin="folio"] .drum-it{font-weight:400;text-transform:none}

.drum-band{position:absolute;left:0;right:0;top:50%;height:46px;margin-top:-23px;border-top:var(--rule) solid var(--ink);border-bottom:var(--rule) solid var(--ink);pointer-events:none}

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@11.18.2/dist/motion.js"></script>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.0.2/lib/anime.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const {useState,useEffect,useRef,useMemo,useCallback,useLayoutEffect}=React;
const html=htm.bind(React.createElement);
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────── REGISTRY ───────── */
const GROUPS=[
 {id:'core',name:'Core',blurb:'Primitives cut from the ledger grid. Hard rules, no radius, type that sits on the baseline.'},
 {id:'motion',name:'Motion',blurb:'Typographic motion. Numbers roll, headings decode, lists file in like entries.'},
 {id:'springs',name:'Springs',engine:'motion.dev',blurb:'Physics on the controls people touch most. Buttons lean toward the pointer, sliders snap into detents, stamps land with weight.'},
 {id:'timelines',name:'Timelines',engine:'anime.js',blurb:'Sequenced motion: split-flap boards, staggered grid ripples, lines that draw themselves, cards that spring back.'},
 {id:'webgl',name:'WebGL',engine:'three.js',blurb:'Data you can stand inside. Instanced bar fields and an embedding space for retrieval.'},
 {id:'depth',name:'Depth',blurb:'3D built into everyday components. CSS 3D for cards, wheels, cubes and folds; three.js where the data needs a real scene. The controls around each one stay ordinary.'},
 {id:'ai',name:'AI',blurb:'Interfaces for model output: streaming, agent traces, context budgets, eval grids.'},
 {id:'screens',name:'Screens',blurb:'Full-screen blocks assembled from the parts above. Drop in, then cut down.'},
 {id:'field',name:'Field notes',blurb:'Research behind the library: what each neighbour does well, and what can legally be borrowed.'},
];

/* ───────── SHELL ───────── */
function copy(text,el){
  try{navigator.clipboard.writeText(text).then(()=>flash(el,'Copied'),()=>sel(el));}catch(e){sel(el)}
  function flash(b,t){if(!b)return;const o=b.textContent;b.textContent=t;setTimeout(()=>b.textContent=o,1200)}
  function sel(b){flash(b,'Select & copy')}
}
function Spec({id,no,name,tag,desc,usage,file,wide,children}){
  const [open,setOpen]=useState(false);
  return html`<section className=${'spec'+(wide?' wide':'')} id=${id} aria-labelledby=${id+'-h'}>
    <div className="spec-h"><span className="no">${no}</span><h3 id=${id+'-h'}>${name}</h3><span className=${'tag'+(tag==='AI'||/\./.test(tag)?' ai':'')}>${tag}</span></div>
    ${desc&&html`<p className="desc">${desc}</p>`}
    <div className="stage">${children}</div>
    ${open&&html`<pre className="usage">${usage}</pre>`}
    <div className="spec-f">
      <button onClick=${()=>setOpen(o=>!o)} aria-expanded=${open}>${open?'Hide usage':'Usage'}</button>
      <button onClick=${e=>copy(usage,e.currentTarget)}>Copy</button>
      <span className="file">${file}</span>
    </div>
  </section>`;
}

/* ───────── CORE ───────── */
const RUNS=[
 {id:'R-2041',model:'atlas-l',set:'support-qa',score:.912,p50:840,status:'pass'},
 {id:'R-2040',model:'atlas-m',set:'support-qa',score:.884,p50:410,status:'pass'},
 {id:'R-2039',model:'atlas-s',set:'support-qa',score:.801,p50:160,status:'drift'},
 {id:'R-2038',model:'local/32b',set:'support-qa',score:.742,p50:1290,status:'fail'},
 {id:'R-2037',model:'atlas-l',set:'tool-use',score:.957,p50:1120,status:'pass'},
 {id:'R-2036',model:'atlas-m',set:'tool-use',score:.931,p50:530,status:'pass'},
];
const RUN_COLS=[{k:'id',l:'Run',big:1},{k:'model',l:'Model'},{k:'set',l:'Dataset'},{k:'score',l:'Score',n:1,r:r=>html`<span className="bar-in" style=${{width:Math.round((r.score-.7)*220)+'px'}}></span>${r.score.toFixed(3)}`},{k:'p50',l:'p50 ms',n:1,r:r=>r.p50.toLocaleString()},{k:'status',l:'Status',r:r=>html`<span className=${'pill '+r.status}>${r.status}</span>`}];
function LedgerTable({title='Eval runs, Oct',data=RUNS,cols=RUN_COLS,init={k:'score',d:-1},rowKey='id'}){
  const [sort,setSort]=useState(init);
  const rows=useMemo(()=>[...data].sort((a,b)=>(a[sort.k]>b[sort.k]?1:a[sort.k]<b[sort.k]?-1:0)*sort.d),[sort,data]);
  const by=k=>setSort(s=>({k,d:s.k===k?-s.d:-1}));
  return html`<div className="tscroll"><table className="ledger">
    <thead><tr className="title"><td className="rn">00</td><td colSpan=${cols.length}>${title}</td></tr>
    <tr><th className="rn">#</th>${cols.map(c=>html`<th key=${c.k} className=${c.n?'num':''} aria-sort=${sort.k===c.k?(sort.d>0?'ascending':'descending'):undefined}>
      <button onClick=${()=>by(c.k)}>${c.l}${sort.k===c.k?(sort.d>0?' ↑':' ↓'):''}</button></th>`)}</tr></thead>
    <tbody>${rows.map((r,i)=>html`<tr key=${r[rowKey]}>
      <td className="rn">${String(i+1).padStart(2,'0')}</td>
      ${cols.map(c=>html`<td key=${c.k} className=${(c.big?'big ':'')+(c.n?'num':'')}>${c.r?c.r(r):r[c.k]}</td>`)}</tr>`)}</tbody>
  </table></div>`;
}
function HoldButton({ms=1200,onDone,children}){
  const [p,setP]=useState(0);const raf=useRef();const t0=useRef();const [done,setDone]=useState(false);
  const start=()=>{if(done)return;t0.current=performance.now();const step=t=>{const v=Math.min(1,(t-t0.current)/ms);setP(v);if(v<1)raf.current=requestAnimationFrame(step);else{setDone(true);onDone&&onDone()}};raf.current=requestAnimationFrame(step)};
  const stop=()=>{cancelAnimationFrame(raf.current);if(!done)setP(0)};
  useEffect(()=>()=>cancelAnimationFrame(raf.current),[]);
  return html`<button className="btn" style=${{'--p':p}} onPointerDown=${start} onPointerUp=${stop} onPointerLeave=${stop}
    onKeyDown=${e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();start()}}} onKeyUp=${stop}
    onClick=${()=>done&&(setDone(false),setP(0))}>
    <span className="fill"></span><span className="lab">${done?'Deleted · tap to reset':children}</span></button>`;
}
function Buttons(){
  return html`<div className="col">
    <div className="row"><button className="btn ink">Deploy</button><button className="btn acc">Run eval</button><button className="btn">Export CSV</button><button className="btn ghost">Cancel</button></div>
    <div className="row"><${HoldButton}>Hold to delete<//><span className="kick">Press and hold 1.2s</span></div>
  </div>`;
}
function Fields(){
  const [v,setV]=useState('support-qa');const [k,setK]=useState('sk-');
  const bad=k.length>0&&k.length<12;
  return html`<div className="col" style=${{maxWidth:'420px'}}>
    <div className="field"><label htmlFor="f-ds"><span>Dataset name</span><span>${v.length}/32</span></label>
      <input id="f-ds" value=${v} maxLength="32" onInput=${e=>setV(e.target.value)}/></div>
    <div className="field"><label htmlFor="f-key"><span>API key</span><span>Required</span></label>
      <input id="f-key" value=${k} onInput=${e=>setK(e.target.value)} style=${bad?{borderBottomColor:'var(--bad)'}:null} aria-invalid=${bad}/>
      ${bad&&html`<span className="err">Keys are at least 12 characters. Paste the full key.</span>`}</div>
  </div>`;
}
function Tabs(){
  const items=[['Overview','Each component is one file. Copy it in, own it, edit the tokens at the top.'],['Tokens','Six colors, three type roles, one rule weight. Skins swap the accent and the display face.'],['Motion','CSS for the simple things, rAF for numbers and text. Every effect checks reduced motion.'],['License','MIT. Use it in commercial work, no attribution needed.']];
  const [i,setI]=useState(0);const refs=useRef([]);const [bar,setBar]=useState({left:0,width:0});
  useLayoutEffect(()=>{const b=refs.current[i];if(b)setBar({left:b.offsetLeft,width:b.offsetWidth})},[i]);
  useEffect(()=>{const f=()=>{const b=refs.current[i];if(b)setBar({left:b.offsetLeft,width:b.offsetWidth})};addEventListener('resize',f);document.fonts&&document.fonts.ready.then(f);return()=>removeEventListener('resize',f)},[i]);
  return html`<div><div className="tabs" role="tablist">${items.map((t,j)=>html`<button key=${j} role="tab" aria-selected=${i===j} ref=${el=>refs.current[j]=el} onClick=${()=>setI(j)}>${t[0]}</button>`)}<span className="bar" style=${bar}></span></div>
  <div className="tabpanel" role="tabpanel">${items[i][1]}</div></div>`;
}
function Toggles(){
  const [a,setA]=useState(true);const [b,setB]=useState(false);const [m,setM]=useState('Week');
  return html`<div className="col">
    <div className="row"><button className="switch" role="switch" aria-checked=${a} onClick=${()=>setA(!a)}><span className="trk"><span className="knb"></span></span>Stream responses</button>
    <button className="switch" role="switch" aria-checked=${b} onClick=${()=>setB(!b)}><span className="trk"><span className="knb"></span></span>Cache prompts</button></div>
    <div className="seg" role="group" aria-label="Range">${['Day','Week','Month','Year'].map(x=>html`<button key=${x} aria-pressed=${m===x} onClick=${()=>setM(x)}>${x}</button>`)}</div>
  </div>`;
}

/* ───────── MOTION ───────── */
function Roll({value,text}){
  const s=text??value.toLocaleString('en-US');const n=s.length;
  return html`<span className="roll" aria-label=${s}>${s.split('').map((c,i)=>/\d/.test(c)
    ?html`<span className="rc" key=${'d'+(n-i)} aria-hidden="true"><span className="rs" style=${{transform:`translateY(${-Number(c)*10}%)`}}>${'0123456789'.split('').map(d=>html`<span key=${d}>${d}</span>`)}</span></span>`
    :html`<span key=${'s'+(n-i)} aria-hidden="true">${c}</span>`)}</span>`;
}
function RollDemo(){
  const [v,setV]=useState(1284903);
  useEffect(()=>{if(RM)return;const t=setInterval(()=>setV(x=>x+Math.floor(Math.random()*4800)),2400);return()=>clearInterval(t)},[]);
  return html`<div className="col"><span className="kick">Tokens processed today</span><${Roll} value=${v}/>
  <div className="row"><button className="btn" onClick=${()=>setV(Math.floor(Math.random()*9e6))}>Randomize</button></div></div>`;
}
function Scramble({text}){
  const [out,setOut]=useState(text);const raf=useRef();
  const run=useCallback(()=>{cancelAnimationFrame(raf.current);if(RM){setOut(text);return}
    const ch='█▓▒░/\\<>_#01';let f=0;const tick=()=>{f++;setOut(text.split('').map((c,i)=>c===' '?' ':(i<f/2.4?c:ch[(Math.random()*ch.length)|0])).join(''));if(f<text.length*2.4+3)raf.current=requestAnimationFrame(tick);else setOut(text)};tick()},[text]);
  useEffect(()=>{run();return()=>cancelAnimationFrame(raf.current)},[run]);
  return html`<div className="col"><div className="scr" onMouseEnter=${run} aria-label=${text}><span aria-hidden="true">${out}</span></div>
  <div className="row"><button className="btn" onClick=${run}>Replay</button><span className="kick">Also runs on hover</span></div></div>`;
}
function Marquee(){
  const words=['Ledger UI','Open source','React','Copy · paste · own','Brutal type','AI-ready','MIT'];
  const seq=[...words,...words];
  return html`<div className="marq" aria-label=${words.join(', ')}><div className="tr" aria-hidden="true">${seq.map((w,i)=>html`<span key=${i}>${w} ✶</span>`)}</div></div>`;
}
function Stagger(){
  const [k,setK]=useState(0);
  const items=[['Invoice INV-0412','Paid','₹48,200'],['Invoice INV-0413','Due 4 Nov','₹12,750'],['Invoice INV-0414','Draft','₹6,900'],['Invoice INV-0415','Overdue','₹31,000']];
  return html`<div className="col"><ul className="stg" key=${k}>${items.map((it,i)=>html`<li key=${i} style=${{animationDelay:(i*90)+'ms'}}><span>${String(i+1).padStart(2,'0')}</span><b>${it[0]}</b><span>${it[1]} · ${it[2]}</span></li>`)}</ul>
  <div className="row"><button className="btn" onClick=${()=>setK(k+1)}>Replay</button></div></div>`;
}

/* ───────── AI ───────── */
const ANSWER='Refunds over 30 days need manager approval {1}. Partial refunds are allowed when the order shipped in parts {2}, and store credit is issued instantly while card refunds take 5 to 7 business days {3}.';
function Stream(){
  const toks=useMemo(()=>ANSWER.split(/(\s+)/),[]);
  const [n,setN]=useState(0);const [run,setRun]=useState(true);
  useEffect(()=>{if(!run)return;if(RM){setN(toks.length);setRun(false);return}
    if(n>=toks.length){setRun(false);return}const t=setTimeout(()=>setN(n+1),28+Math.random()*40);return()=>clearTimeout(t)},[n,run]);
  const shown=toks.slice(0,n).map((t,i)=>{const m=t.match(/^\{(\d)\}(.*)$/);return m?html`<span key=${i}><span className="cite" title=${'Source '+m[1]}>${m[1]}</span>${m[2]}</span>`:t});
  return html`<div className="col">
    <div className="stream" aria-live="polite">${shown}${run&&html`<span className="caret"></span>`}</div>
    <div className="srcs">${[['1','refund-policy.md §2'],['2','fulfilment/split.md'],['3','payments-faq.pdf p.4']].map(s=>html`<div key=${s[0]}><b>[${s[0]}]</b>${s[1]}</div>`)}</div>
    <div className="row">${run?html`<button className="btn" onClick=${()=>setRun(false)}>Stop</button>`:html`<button className="btn acc" onClick=${()=>{setN(0);setRun(true)}}>Regenerate</button>`}<span className="kick">${n}/${toks.length} tokens</span></div>
  </div>`;
}
const STEPS=[
 {tool:'plan',arg:'split question into 3 sub-queries',ms:220,out:'3 sub-queries: policy window, partial refunds, payout timing'},
 {tool:'search',arg:'kb: "refund window approval"',ms:640,out:'14 chunks from 5 files'},
 {tool:'fetch',arg:'refund-policy.md',ms:310,out:'2,140 tokens read'},
 {tool:'rerank',arg:'top 14 → 5',ms:180,out:'kept 5, dropped 9 below 0.42'},
 {tool:'answer',arg:'compose with citations',ms:1450,out:'412 tokens, 3 citations'},
];
function Trace(){
  const [at,setAt]=useState(0);const [open,setOpen]=useState(-1);
  useEffect(()=>{if(at>=STEPS.length)return;const t=setTimeout(()=>setAt(at+1),RM?0:STEPS[at].ms*.9);return()=>clearTimeout(t)},[at]);
  const total=STEPS.reduce((a,s)=>a+s.ms,0);const doneMs=STEPS.slice(0,at).reduce((a,s)=>a+s.ms,0);
  return html`<div className="trace">
    ${STEPS.map((s,i)=>{const st=i<at?'done':i===at?'run':'queued';return html`<div key=${i} className=${st}>
      <button className="st" onClick=${()=>setOpen(open===i?-1:i)} aria-expanded=${open===i}>
        <span className="ic"></span><span className="tool">${s.tool}</span><span className="arg">${s.arg}</span><span className="ms">${st==='queued'?'—':s.ms+' ms'}</span></button>
      ${open===i&&html`<div className="out">→ ${st==='done'?s.out:'not finished yet'}</div>`}</div>`})}
    <div className="tl"><i style=${{width:(doneMs/total*100)+'%'}}></i></div>
    <div className="row" style=${{marginTop:'14px',justifyContent:'space-between'}}><span className="kick">${at>=STEPS.length?'Done in '+(total/1000).toFixed(2)+' s':'Step '+(at+1)+' of '+STEPS.length}</span><button className="btn" onClick=${()=>{setAt(0);setOpen(-1)}}>Replay</button></div>
  </div>`;
}
function Composer(){
  const [t,setT]=useState('Summarise the refund policy changes for the support team');
  const [files,setFiles]=useState(['refund-policy.md','q3-tickets.csv']);
  const [sent,setSent]=useState('');
  const used=Math.min(1,(t.length*1.3+files.length*1800)/32000);
  return html`<div><div className="composer">
    <label className="kick" htmlFor="cmp" style=${{display:'block',padding:'10px 14px 0'}}>Prompt</label>
    <textarea id="cmp" value=${t} onInput=${e=>{setT(e.target.value);setSent('')}} onKeyDown=${e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&t.trim())setSent('Sent to '+document.getElementById('cmp-m').value)}}></textarea>
    <div className="chips">${files.map(f=>html`<span className="chip" key=${f}>${f}<button aria-label=${'Remove '+f} onClick=${()=>setFiles(files.filter(x=>x!==f))}>×</button></span>`)}
      ${files.length<3&&html`<button className="chip" style=${{cursor:'pointer',padding:'2px 8px'}} onClick=${()=>setFiles([...files,'notes-'+(files.length+1)+'.md'])}>+ Attach</button>`}</div>
    <div className="cbar"><select id="cmp-m" aria-label="Model"><option>atlas-l</option><option>atlas-m</option><option>atlas-s</option></select>
      <div className="meter"><span>${Math.round(used*100)}%</span><div><i style=${{width:used*100+'%'}}></i></div><span>of 32k</span></div>
      <button className="send" disabled=${!t.trim()} onClick=${()=>setSent('Sent to '+document.getElementById('cmp-m').value)}>Send ⌘↵</button></div>
  </div>${sent&&html`<div className="toast">${sent}</div>`}</div>`;
}
function Thinking(){

  useLayoutEffect(()=>{const m=()=>{W.current=track.current.clientWidth;place(pos(i),'instant')};m();const ro=new ResizeObserver(m);ro.observe(track.current);return()=>ro.disconnect()},[]);

function useGL(host,setup,deps=[]){

    r.setPixelRatio(Math.min(2,devicePixelRatio));el.appendChild(r.domElement);
    const api=setup(r,el);let run=true,vis=true,raf,f=0;
    const size=()=>{const w=el.clientWidth,h=el.clientHeight;r.setSize(w,h,false);api.resize(w,h)};size();
    const ro=new ResizeObserver(size);ro.observe(el);
    const io=new IntersectionObserver(es=>{vis=es[0].isIntersecting;if(vis&&!raf)loop(performance.now())});io.observe(el);
    const loop=t=>{raf=null;if(!run)return;if(f++%40===0)api.palette(pal(el));api.frame(t/1000);r.render(api.scene,api.cam);if(vis&&!RM)raf=requestAnimationFrame(loop)};
    api.palette(pal(el));loop(performance.now());
    return()=>{run=false;cancelAnimationFrame(raf);ro.disconnect();io.disconnect();api.dispose&&api.dispose();r.dispose();r.domElement.remove()}},deps);
}

function useSpring(init,apply,o={}){
  const v=useRef(init),c=useRef(),fn=useRef(apply);fn.current=apply;
  const set=useCallback((to,x={})=>{if(c.current&&c.current.stop)c.current.stop();
    if(x.instant||!MO||RM){v.current=to;fn.current(to);return}
    try{c.current=MO.animate(v.current,to,{type:'spring',stiffness:x.stiffness??o.stiffness??300,damping:x.damping??o.damping??26,mass:o.mass??1,velocity:x.velocity??0,restDelta:.0005,restSpeed:.001,onUpdate:n=>{v.current=n;fn.current(n)}})}
    catch(e){v.current=to;fn.current(to)}},[]);
  return useMemo(()=>({set,get:()=>v.current}),[set]);
}

  usage:`<LedgerTable title="Landscape" data={libraries} rowKey="lib"
  columns={[{ key: "lib", label: "Library", emphasis: true }, ...]} />`,
  el:()=>html`<${LedgerTable} title="Landscape" data=${LAND} rowKey="lib" init=${{k:'lib',d:1}} cols=${[{k:'lib',l:'Library',big:1},{k:'focus',l:'Known for'},{k:'stack',l:'Motion'},{k:'lic',l:'License'},{k:'take',l:'What Ledger takes'}]}/>`},
];

/* ───────── APP ───────── */
function App(){
  const [skin,setSkin]=useState(()=>{try{return localStorage.getItem('lui-skin')||'ledger'}catch(e){return 'ledger'}});
  const [theme,setTheme]=useState('system');
  useEffect(()=>{try{localStorage.setItem('lui-skin',skin)}catch(e){}},[skin]);
  useEffect(()=>{const r=document.documentElement;if(theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',theme)},[theme]);
  let n=0;
  const go=(e,id)=>{e.preventDefault();const el=document.getElementById(id);el&&el.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'})};
  const cmd='npx ledger-ui add ledger-table';
  return html`<div className="app" data-skin=${skin}>
    <nav className="rail" aria-label="Components">
      <div className="mark">Ledger<br/>UI</div>
      ${GROUPS.map(g=>html`<${React.Fragment} key=${g.id}><div className="grp">${g.name}</div>${C.filter(c=>c.g===g.id).map(c=>{n++;return html`<a key=${c.id} href=${'#'+c.id} onClick=${e=>go(e,c.id)}><span>L-${String(n).padStart(2,'0')}</span><span>${c.name}</span></a>`})}<//>`)}
      <div className="foot">v0.3 · MIT · React 18+</div>
    </nav>
    <main>
      <div className="top">
        <div className="cell"><span className="lbl">Skin</span><div className="seg">${[['ledger','Ledger'],['terminal','Terminal'],['folio','Folio']].map(s=>html`<button key=${s[0]} aria-pressed=${skin===s[0]} onClick=${()=>setSkin(s[0])}>${s[1]}</button>`)}</div></div>
        <div className="cell"><span className="lbl">Theme</span><div className="seg">${['system','light','dark'].map(t=>html`<button key=${t} aria-pressed=${theme===t} onClick=${()=>setTheme(t)}>${t}</button>`)}</div></div>
        <div className="cell"><span className="lbl">${C.length} components</span></div>
      </div>
      <header className="hero">
        <h1><span>Ledger<br/><em>/</em>UI</span></h1>
        <div className="meta">
          <${Terrain}/>
          <p>Open source React components cut from a ledger: full-bleed grids, hard rules, type that sits on the baseline. Core parts, spring physics from motion.dev, timelines from anime.js, WebGL from three.js, 3D built into everyday controls, AI interfaces and full screens. Copy a file in and it is yours.</p>
          <div className="stats"><div><b>${C.length}</b><small>Components</small></div><div><b>3</b><small>Motion engines</small></div><div><b>3</b><small>Skins</small></div></div>
          <div className="install"><code>$ ${cmd}</code><button onClick=${e=>copy(cmd,e.currentTarget)}>Copy</button></div>
        </div>
      </header>
      ${(()=>{let k=0;return GROUPS.map(g=>html`<div key=${g.id}>
        <div className="sect-h"><h2>${g.name}</h2><p>${g.blurb}</p></div>
        <div className="grid">${C.filter(c=>c.g===g.id).map(c=>{k++;const El=c.el;return html`<${Spec} key=${c.id} id=${c.id} no=${'L-'+String(k).padStart(2,'0')} name=${c.name} tag=${c.engine||g.engine||(g.id==='ai'?'AI':g.name)} desc=${c.desc} usage=${c.usage} file=${c.file} wide=${c.wide}><${El}/><//>`})}</div>
      </div>`)})()}
      <footer className="colophon">
        <div><h4>Distribution</h4><p>Each component is one file with its tokens at the top. A CLI copies files into your project, shadcn-style, so there is no package to upgrade around.</p></div>
        <div><h4>Skins &amp; license</h4><p>Ledger, Terminal and Folio share the same markup; a skin swaps the accent and the display face. MIT. Sample data on this page is invented.</p></div>
        <div><h4>Engines</h4><p>Each component names its engine in the header. Install only the engine a component needs: motion for springs, anime.js for timelines, three for WebGL. Every effect falls back to a still frame under reduced motion.</p></div>
      </footer>
    </main>
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
